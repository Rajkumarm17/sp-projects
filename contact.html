<script>
    // Get button and menu elements
    const menuBtn = document.getElementById("menu-btn");
    const menu = document.getElementById("mobile-menu");
    const btn = document.getElementById('btn')

    // Add click event
    menuBtn.addEventListener("click", function () {
        if (menu.classList.contains("hidden")) {
            // If menu is hidden → show it
            menu.classList.remove("hidden");
            btn.style.color = "gray";
        } else {
            // If menu is visible → hide it
            menu.classList.add("hidden");
            btn.style.color = "black";

        }
    });

    const ScrollNav = document.getElementById("nav-tag");
    window.onscroll = function () {
        if (document.body.scrollTop > 100 || document.documentElement.scrollTop > 100) {
            ScrollNav.style.backgroundColor = "white";

        } else {
            ScrollNav.style.backgroundColor = "transparent";

        }
    };
</script>
